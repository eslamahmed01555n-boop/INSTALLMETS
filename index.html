<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة الأقساط</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--pr:#0f5e63;--on:#fff;--red:#b42318;--amb:#b45309;--grn:#117a3d}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--card:#191e23;--tx:#eceff3;--mu:#98a2ad;--bd:#2a3138;--pr:#3fc1c9;--on:#06282b;--red:#f87171;--amb:#fbbf24;--grn:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:14px}.b{font-weight:700}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
button,.btn{font:inherit;font-weight:700;background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--red);border:1px solid var(--bd);padding:4px 10px;font-size:13px}
button:disabled{opacity:.5}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;border-radius:30px;padding:14px 22px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stats .card{margin:0}.n{font-size:22px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 14px;font-weight:400}
.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.tag{font-size:13px;font-weight:700}
.cust{cursor:pointer;border-inline-start:4px solid var(--c,var(--bd))}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:start}
.scroll{overflow-x:auto}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9;display:none}
.err{color:var(--red);min-height:24px}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
// غيّر العنوان ده برابط الـ Webhook بتاع n8n (Production URL)
const API_URL='https://https://primary-production-8e4d1.up.railway.app/webhook/installments-api/webhook/installments-api';

const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const ST={overdue:['متأخر','var(--red)'],due_today:['مستحق النهاردة','var(--amb)'],regular:['منتظم','var(--grn)'],settled:['خالص','var(--mu)']};
let S={list:null,f:'all',q:''};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)}
async function api(action,d={}){
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:sessionStorage.pin||'',action,...d})});
    const j=await r.json();
    if(j.code===401){delete sessionStorage.pin;S.list=null}
    return j;
  }catch(e){return{ok:false,error:'مفيش اتصال بالسيرفر، جرّب تاني'}}
}
const loading=()=>app.innerHTML='<p class="mu" style="text-align:center;margin-top:40px">جاري التحميل...</p>';

function login(msg=''){
  app.innerHTML=`<h1>متابعة الأقساط</h1><div class="card"><label for="pin">الرقم السري</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><div class="err" id="e">${esc(msg)}</div>
  <button id="go" style="width:100%">دخول</button></div>`;
  const go=async()=>{const p=document.getElementById('pin').value;if(!p)return;sessionStorage.pin=p;document.getElementById('go').disabled=true;
    const j=await api('ping');if(j.ok)route();else login(j.error||'الرقم السري غلط')};
  document.getElementById('go').onclick=go;document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')go()};
}

async function home(){
  if(!S.list){loading();const j=await api('list');if(!j.ok){if(!sessionStorage.pin)return login(j.error);app.innerHTML='<p class="err">'+esc(j.error)+'</p><button onclick="route()">إعادة المحاولة</button>';return}S.list=j}
  const st=S.list.stats;
  app.innerHTML=`<div class="row"><h1>الأقساط</h1><button class="g" id="out">خروج</button></div>
  <div class="stats">
   <div class="card"><div class="mu">متأخرين</div><div class="n" style="color:var(--red)">${st.overdue_count}</div><div class="mu">${money(st.overdue_amount)} ج</div></div>
   <div class="card"><div class="mu">مستحق النهاردة</div><div class="n" style="color:var(--amb)">${st.due_today}</div></div>
   <div class="card" style="grid-column:span 2"><div class="mu">الشهر ده: المحصّل من المتوقع</div><div class="n">${money(st.month_collected)} / ${money(st.month_expected)} ج</div></div>
  </div>
  <input id="q" type="search" placeholder="ابحث بالاسم أو التليفون" value="${esc(S.q)}" autocomplete="off">
  <div class="chips">${[['all','الكل'],['overdue','متأخرين'],['due_today','مستحق النهاردة'],['settled','خالص']].map(([k,l])=>`<button class="chip ${S.f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div id="list"></div><button class="fab" id="add">+ عميل جديد</button>`;
  document.getElementById('out').onclick=()=>{sessionStorage.clear();S.list=null;route()};
  document.getElementById('add').onclick=()=>location.hash='add';
  document.getElementById('q').oninput=e=>{S.q=e.target.value;drawList()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;home()});
  drawList();
}
function drawList(){
  const q=norm(S.q),L=S.list.customers.filter(c=>(S.f==='all'||c.status===S.f)&&(!q||norm(c.name).includes(q)||String(c.phone).includes(q)));
  document.getElementById('list').innerHTML=L.length?L.map(c=>{const [t,col]=ST[c.status];return`<div class="card cust" style="--c:${col}" onclick="location.hash='c/${esc(c.id)}'">
   <div class="row"><span class="b">${esc(c.name)}</span><span class="tag" style="color:${col}">${t}</span></div>
   <div class="mu">${esc(c.product)} · ${esc(c.phone)}</div>
   <div class="row mu"><span>${c.status==='overdue'?c.late_count+' قسط متأخر · '+c.days_late+' يوم · '+money(c.late_amount)+' ج':c.next_due?'القسط الجاي '+c.next_due+' · '+money(c.next_amount)+' ج':'تم السداد'}</span><span>متبقي ${money(c.remaining)}</span></div></div>`}).join(''):'<p class="mu" style="text-align:center">مفيش نتايج</p>';
}

async function profile(id){
  loading();const j=await api('customer',{id});
  if(!j.ok){app.innerHTML='<p class="err">'+esc(j.error)+'</p><a class="btn" href="#">رجوع</a>';return}
  const c=j.customer,s=j.summary,[t,col]=ST[s.status],today=j.today;
  const ist=i=>{const r=i.amount-i.paid;return r<=0.001?['مدفوع','var(--grn)']:i.due_date<today?['متأخر','var(--red)']:i.paid>0?['جزئي','var(--amb)']:['قادم','var(--mu)']};
  app.innerHTML=`<div class="row"><a href="#" class="btn g">رجوع</a><span class="tag" style="color:${col}">${t}</span></div>
  <h1>${esc(c.name)}</h1>
  <div class="card"><div>${esc(c.product)}</div><div class="mu">${esc(c.phone)}</div>
   <div style="margin:8px 0" class="row"><a class="btn g" href="tel:${esc(c.phone)}">اتصال</a><a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${esc(String(c.phone).replace(/\D/g,'').replace(/^0/,'20'))}">واتساب</a></div>
   <div class="row"><span>المتبقي</span><span class="b">${money(s.remaining)} ج (${s.remaining_count} قسط)</span></div>
   ${s.status==='overdue'?`<div class="row" style="color:var(--red)"><span>متأخر</span><span class="b">${money(s.late_amount)} ج · ${s.days_late} يوم</span></div>`:''}
   ${c.notes?`<div class="mu" style="margin-top:6px">${esc(c.notes)}</div>`:''}</div>
  ${s.remaining_count?`<h2>تسجيل دفعة</h2><div class="card"><label>المبلغ</label><input id="amt" type="number" inputmode="decimal" min="0" step="any">
   <label>التاريخ</label><input id="dt" type="date" value="${today}"><div class="err" id="e"></div><button id="pay" style="width:100%">تسجيل الدفعة</button></div>`:''}
  <h2>الأقساط</h2><div class="card scroll"><table><tr><th>#</th><th>الميعاد</th><th>المطلوب</th><th>المدفوع</th><th>الحالة</th></tr>
  ${j.installments.map(i=>{const [a,cl]=ist(i);return`<tr><td>${i.no}</td><td>${i.due_date}</td><td>${money(i.amount)}</td><td>${money(i.paid)}</td><td style="color:${cl};font-weight:700">${a}</td></tr>`}).join('')}</table></div>
  <h2>سجل الدفعات</h2>${j.payments.length?j.payments.map(p=>`<div class="card" style="${p.voided?'opacity:.5':''}"><div class="row"><span class="b">${money(p.amount)} ج</span><span class="mu">${p.date}</span></div>
   <div class="row mu"><span>${p.voided?'ملغية':'أقساط '+esc(p.allocation.replace(/(\d+):/g,'$1 ← '))}</span>${p.voided?'':`<button class="d" data-v="${esc(p.id)}">إلغاء</button>`}</div></div>`).join(''):'<p class="mu">مفيش دفعات</p>'}`;
  const pay=document.getElementById('pay');
  if(pay)pay.onclick=async()=>{const amount=document.getElementById('amt').value,date=document.getElementById('dt').value,e=document.getElementById('e');
    if(!(amount>0)){e.textContent='اكتب المبلغ';return}
    if(!confirm('تسجيل '+money(amount)+' ج للعميل '+c.name+'؟'))return;
    pay.disabled=true;let r=await api('addPayment',{customer_id:id,amount:+amount,date});
    if(r.duplicate&&confirm(r.error+'\nتسجل برضه؟'))r=await api('addPayment',{customer_id:id,amount:+amount,date,force:true});
    if(r.ok){S.list=null;toast('تم تسجيل الدفعة');profile(id)}else{e.textContent=r.error||'';pay.disabled=false}};
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{if(!confirm('إلغاء الدفعة دي؟ هيتعاد توزيع الأقساط.'))return;b.disabled=true;const r=await api('voidPayment',{payment_id:b.dataset.v});if(r.ok){S.list=null;toast('تم الإلغاء');profile(id)}else{toast(r.error);b.disabled=false}});
}

function addForm(){
  const f=(id,l,ty='text',x='')=>`<label for="${id}">${l}</label><input id="${id}" type="${ty}" ${x}>`;
  app.innerHTML=`<div class="row"><a href="#" class="btn g">رجوع</a></div><h1>عميل جديد</h1><div class="card">
  ${f('name','الاسم')}${f('phone','التليفون','tel','inputmode="tel"')}${f('product','المنتج')}
  ${f('price','سعر المنتج','number','inputmode="decimal"')}${f('down','المقدم (لو فيه)','number','inputmode="decimal"')}
  ${f('n','عدد الأقساط','number','inputmode="numeric"')}${f('amt','قيمة القسط (سيبها فاضية للحساب التلقائي)','number','inputmode="decimal"')}
  ${f('first','ميعاد أول قسط','date')}${f('notes','ملاحظات')}
  <div class="err" id="e"></div><button id="save" style="width:100%">حفظ العميل</button></div>`;
  const v=id=>document.getElementById(id).value.trim();
  document.getElementById('save').onclick=async function(){
    const customer={name:v('name'),phone:v('phone'),product:v('product'),price:v('price'),down_payment:v('down'),installments_count:v('n'),installment_amount:v('amt'),first_due_date:v('first'),notes:v('notes')};
    this.disabled=true;let r=await api('addCustomer',{customer});
    if(r.duplicate&&confirm(r.error+'\nتضيفه برضه؟'))r=await api('addCustomer',{customer,force:true});
    if(r.ok){S.list=null;toast('تم إضافة العميل');location.hash='c/'+r.id}else{document.getElementById('e').textContent=r.error||'';this.disabled=false}};
}

function route(){
  const h=location.hash.slice(1);
  if(!sessionStorage.pin)return login();
  if(h.startsWith('c/'))return profile(h.slice(2));
  if(h==='add')return addForm();
  home();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
